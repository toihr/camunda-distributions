# Camunda 8.10 — adapted for deployment behind Coolify's Traefik proxy.
# Upstream file is intended for local development only; see notes below.
services:
  camunda-data-init:
    image: camunda/camunda:${CAMUNDA_VERSION}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration: # Zeebe + Operate + Tasklist + Identity, HTTP UI/API on 8080
    image: camunda/camunda:${CAMUNDA_VERSION}
    environment:
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=75
    env_file:
      - path: .env
        required: true
    mem_limit: 3g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 1s
      retries: 30
      start_period: 60s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
      - ./driver-lib:/driver-lib:ro
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    networks:
      - camunda   # internal: connectors reach this by service name
      - coolify   # external: Traefik reaches port 8080 here
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

  connectors:
    image: camunda/connectors-bundle:${CAMUNDA_CONNECTORS_VERSION}
    env_file:
      - connector-secrets.txt
      - path: .env
        required: true
    mem_limit: 512m
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 1s
      retries: 5
      start_period: 30s
    configs:
      - source: connectors-config
        target: /application.yaml
    networks:
      - camunda
    depends_on:
      orchestration:
        condition: service_healthy

volumes:
  camunda:
  camunda-data:

networks:
  camunda:
    name: camunda
  coolify:
    external: true

configs:
  connectors-config:
    content: |
      camunda:
        client:
          mode: self-managed
          grpc-address: http://orchestration:26500
          rest-address: http://orchestration:8080
        connector:
          secretprovider:
            environment:
              prefix: "CONNECTORS_SECRET"
      management:
        endpoints:
          web:
            exposure:
              include: health,configprops
        endpoint:
          health:
            probes:
              enabled: true

  orchestration-config:
    file: ./configuration/${ORCHESTRATION_CONFIG_FILE:-application-h2.yaml}
